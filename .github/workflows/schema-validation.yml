name: Schema Validation and Deployment

on:
  pull_request:
    paths:
      - '**.zed'
  push:
    branches:
      - main
    paths:
      - '**.zed'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup ZED CLI
        run: |
          sudo apt update
          sudo apt install -y zed

      - name: Validate schema
        run: zed validate

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup ZED CLI
        run: |
          sudo apt install -y zed

      - name: Compile schema
        run: zed preview schema compile root.zed > compiled.zed

      - name: Write schema to SpiceDB
        run: |
          zed schema write \
            --endpoint=${{ secrets.SPICEDB_ENDPOINT }} \
            --token=${{ secrets.SPICEDB_TOKEN }} \
            --schema-file=compiled.zed
